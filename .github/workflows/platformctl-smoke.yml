name: Platformctl smoke

on:
  workflow_dispatch: # Recovery and post-publication verification; no user-controlled inputs.
  pull_request:
    paths:
      - .github/workflows/platformctl-smoke.yml
      - .github/workflows/platformctl-release.yml
      - .goreleaser.yml
      - cmd/platformctl/**
      - internal/platformctl/**
      - web/portal/**
      - docs/cli/**
      - scripts/install-platformctl.*

permissions:
  contents: read

concurrency:
  group: platformctl-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: ${{ matrix.os }} CLI contract
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: go1.25.13
      CGO_ENABLED: "0"
      # Pull requests verify the last known release. A manual run resolves the
      # latest published v1 release below, allowing post-publication proof.
      INSTALLER_RELEASE_VERSION: ${{ github.event_name == 'pull_request' && 'v1.0.0' || 'v1.0.1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve latest published installer release
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $result = & gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" --jq '.tag_name'
          if ($LASTEXITCODE -ne 0) { throw 'Unable to resolve the latest published platformctl release.' }
          $tag = ($result | Select-Object -First 1).Trim()
          if ($tag -cnotmatch '^v1\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw "Latest published release '$tag' is not a supported v1 semantic version."
          }
          "INSTALLER_RELEASE_VERSION=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install checksum-verified Go on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          source scripts/versions.env
          case "$(uname -m)" in
            arm64|aarch64) go_arch=arm64; expected="$GO_DARWIN_ARM64_SHA256" ;;
            x86_64|amd64) go_arch=amd64; expected="$GO_DARWIN_AMD64_SHA256" ;;
            *) echo "Unsupported macOS architecture: $(uname -m)" >&2; exit 2 ;;
          esac
          archive="$RUNNER_TEMP/go${GO_VERSION}.darwin-${go_arch}.tar.gz"
          url="https://go.dev/dl/go${GO_VERSION}.darwin-${go_arch}.tar.gz"
          curl --fail --location --retry 5 --retry-all-errors --output "$archive" "$url"
          actual="$(shasum -a 256 "$archive" | awk '{print $1}')"
          test "$actual" = "$expected"
          mkdir -p "$RUNNER_TEMP/go"
          tar -xzf "$archive" --strip-components=1 -C "$RUNNER_TEMP/go"
          echo "$RUNNER_TEMP/go/bin" >> "$GITHUB_PATH"
      - name: Verify exact Go and CLI contracts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .artifacts | Out-Null
          $actual = (go version)
          if ($actual -notmatch 'go1\.25\.13') { throw "Expected Go 1.25.13, got $actual" }
          go test ./internal/platformctl/...
          go build -trimpath -o .artifacts/platformctl${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/platformctl
          & ./.artifacts/platformctl${{ runner.os == 'Windows' && '.exe' || '' }} --output json version
          & ./.artifacts/platformctl${{ runner.os == 'Windows' && '.exe' || '' }} --output json profile list
          & ./.artifacts/platformctl${{ runner.os == 'Windows' && '.exe' || '' }} docs --directory .artifacts/docs
          $portal = (& ./.artifacts/platformctl${{ runner.os == 'Windows' && '.exe' || '' }} --output json version | ConvertFrom-Json)
          if ($portal.portalVersion -ne 'v1.0.1' -or $portal.portalAssetsDigest -cnotmatch '^sha256:[0-9a-f]{64}$') { throw 'Embedded portal metadata is invalid.' }
      - name: Verify released installer with Windows PowerShell
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $expected = $env:INSTALLER_RELEASE_VERSION.TrimStart('v')
          ./scripts/install-platformctl.ps1 -Version $env:INSTALLER_RELEASE_VERSION -InstallDirectory .artifacts/installed
          $binary = Join-Path $PWD '.artifacts/installed/platformctl.exe'
          $installed = (& $binary --output json version | ConvertFrom-Json)
          if ($installed.version -ne $expected) { throw "Expected installed version $expected, got $($installed.version)" }
      - name: Verify released installer with POSIX shell
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export PLATFORMCTL_VERSION="$INSTALLER_RELEASE_VERSION"
          export PLATFORMCTL_INSTALL_DIR="$PWD/.artifacts/installed"
          bash ./scripts/install-platformctl.sh
          expected="${INSTALLER_RELEASE_VERSION#v}"
          binary="${PLATFORMCTL_INSTALL_DIR}/platformctl"
          output="$("$binary" --output json version)"
          printf '%s' "$output" | grep -Eq "\"version\"[[:space:]]*:[[:space:]]*\"${expected}\""
      - name: Launch and verify native embedded portal
        shell: pwsh
        run: |
          $config = Join-Path $PWD '.artifacts/native-config'
          if ($env:RUNNER_OS -eq 'Windows') { $env:APPDATA = $config } else { $env:XDG_CONFIG_HOME = $config }
          $binary = Join-Path $PWD ".artifacts/platformctl${{ runner.os == 'Windows' && '.exe' || '' }}"
          & $binary --output json config init --checkout $PWD --repository $env:GITHUB_REPOSITORY --profile minimal
          $private = Join-Path $PWD '.artifacts/private-portal'
          New-Item -ItemType Directory -Force $private | Out-Null
          $stdout = Join-Path $private 'ready.txt'
          $stderr = Join-Path $private 'launch.txt'
          $process = Start-Process -FilePath $binary -ArgumentList @('--output','json','portal','--no-open') -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(20)
            do {
              Start-Sleep -Milliseconds 250
              $content = if (Test-Path $stderr) { Get-Content -Raw $stderr } else { '' }
              if ($content -match '(http://127\.0\.0\.1:\d+/launch/[0-9a-f]{64})') { $launch = $Matches[1]; break }
            } while ((Get-Date) -lt $deadline -and -not $process.HasExited)
            if (-not $launch) { throw 'Native portal did not start.' }
            $handler = [System.Net.Http.HttpClientHandler]::new()
            $handler.AllowAutoRedirect = $false
            $handler.UseCookies = $false
            $client = [System.Net.Http.HttpClient]::new($handler)
            try {
              $exchange = $client.GetAsync($launch).GetAwaiter().GetResult()
              if ($exchange.StatusCode -ne [System.Net.HttpStatusCode]::SeeOther -or $exchange.Headers.Location.OriginalString -ne '/') {
                throw 'Native portal launch exchange did not return the expected clean redirect.'
              }
              $cookie = ($exchange.Headers.GetValues('Set-Cookie') | Select-Object -First 1)
              if ($cookie -notmatch 'HttpOnly' -or $cookie -notmatch 'Secure' -or $cookie -notmatch 'SameSite=Strict') {
                throw 'Native portal launch exchange did not return the strict session cookie.'
              }
              $request = [System.Net.Http.HttpRequestMessage]::new([System.Net.Http.HttpMethod]::Get, ($launch -replace '/launch/[0-9a-f]{64}$', '/'))
              $request.Headers.TryAddWithoutValidation('Cookie', $cookie.Split(';')[0]) | Out-Null
              $served = $client.SendAsync($request).GetAwaiter().GetResult()
              $content = $served.Content.ReadAsStringAsync().GetAwaiter().GetResult()
              if (-not $served.IsSuccessStatusCode -or $content -notmatch 'SteadyState') { throw 'Native portal did not serve its embedded application.' }
            } finally {
              if ($request) { $request.Dispose() }
              if ($exchange) { $exchange.Dispose() }
              if ($served) { $served.Dispose() }
              $client.Dispose()
              $handler.Dispose()
            }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
            Remove-Item -LiteralPath $private -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Hosted failure-diagnosis and break-glass fixtures
        if: runner.os == 'Linux'
        shell: pwsh
        run: >-
          go test -v ./internal/platformctl
          -run 'TestApplicationDoctorFailureFixtures|TestBreakGlass'
          -count=1
      - name: Upload smoke snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: platformctl-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: .artifacts/
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: true

  cross-compile:
    name: six-target cross-compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: go1.25.13
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build all supported targets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .artifacts | Out-Null
          foreach ($os in @('windows','linux','darwin')) {
            foreach ($arch in @('amd64','arm64')) {
              $env:GOOS = $os
              $env:GOARCH = $arch
              $extension = if ($os -eq 'windows') { '.exe' } else { '' }
              go build -trimpath -o ".artifacts/$os-$arch/platformctl$extension" ./cmd/platformctl
              if ($LASTEXITCODE -ne 0) { throw "Cross-compile failed for $os/$arch" }
            }
          }
      - name: Upload cross-compiled binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: platformctl-six-targets-${{ github.sha }}
          path: .artifacts/
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: true

  release-snapshot:
    name: release archive snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: go1.25.13
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install checksum-verified Syft
        shell: bash
        run: |
          source scripts/versions.env
          mkdir -p .artifacts/syft
          archive=".artifacts/syft/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 5 --retry-max-time 180 --connect-timeout 30 \
            --output "$archive" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_LINUX_AMD64_SHA256}  ${archive}" | sha256sum --check --status
          tar -xzf "$archive" -C .artifacts/syft syft
          chmod +x .artifacts/syft/syft
          echo "$GITHUB_WORKSPACE/.artifacts/syft" >> "$GITHUB_PATH"
      - name: Build six archives, checksums, and SPDX SBOMs
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --snapshot --clean
      - name: Upload release snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: platformctl-release-snapshot-${{ github.sha }}
          path: dist/
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true
