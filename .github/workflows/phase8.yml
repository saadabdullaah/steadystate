name: Phase 8 acceptance

on:
  schedule:
    - cron: "13 8 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/phase8.yml
      - scripts/phase8-acceptance.ps1
      - docs/demonstrations/phase8-zero-to-live.tape

permissions:
  contents: read

concurrency:
  group: phase8-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  acceptance:
    name: cli-golden-path-and-safe-retirement
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      XDG_CONFIG_HOME: ${{ github.workspace }}/.artifacts/phase8/config-home
      PHASE8_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PHASE8_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Create repository-scoped acceptance token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.STEADYSTATE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.STEADYSTATE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Configure acceptance Git identity
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          $encoded = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GH_TOKEN"))
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $encoded"
          git config user.name "${env:APP_SLUG}[bot]"
          $userID = gh api "/users/${env:APP_SLUG}[bot]" --jq .id
          if ($LASTEXITCODE -ne 0 -or -not $userID) { throw 'Could not resolve the GitHub App identity.' }
          git config user.email "$userID+${env:APP_SLUG}[bot]@users.noreply.github.com"

      - name: Install and verify pinned full-profile tools
        timeout-minutes: 12
        shell: pwsh
        run: |
          ./scripts/install-tools.ps1 -BaseOnly -IncludeSecurity
          ./scripts/dev.ps1 check-versions
          ./scripts/dev.ps1 verify-gitops
          ./scripts/dev.ps1 verify-observability
          ./scripts/dev.ps1 verify-security
          ./scripts/dev.ps1 verify-data

      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.2

      - name: Install pinned recording tools
        timeout-minutes: 6
        shell: bash
        run: |
          set -euo pipefail
          eval "$(grep -E '^(VHS_VERSION|TTYD_VERSION|VHS_LINUX_X86_64_SHA256|TTYD_LINUX_X86_64_SHA256)=' scripts/versions.env)"
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes ffmpeg
          fi
          install_dir="$RUNNER_TEMP/steadystate-recording/bin"
          mkdir -p "$install_dir"
          archive="$RUNNER_TEMP/vhs_${VHS_VERSION}_Linux_x86_64.tar.gz"
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 30 --output "$archive" "https://github.com/charmbracelet/vhs/releases/download/v${VHS_VERSION}/vhs_${VHS_VERSION}_Linux_x86_64.tar.gz"
          echo "${VHS_LINUX_X86_64_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --strip-components=1 --file "$archive" --directory "$install_dir"
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 30 --output "$install_dir/ttyd" "https://github.com/tsl0922/ttyd/releases/download/${TTYD_VERSION}/ttyd.x86_64"
          echo "${TTYD_LINUX_X86_64_SHA256}  ${install_dir}/ttyd" | sha256sum --check --strict
          chmod 0755 "$install_dir/vhs" "$install_dir/ttyd"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Build and configure exact-revision CLI
        id: cli
        timeout-minutes: 5
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .artifacts | Out-Null
          go build -trimpath -ldflags "-X main.version=v0.8.0 -X main.commit=$env:PHASE8_SOURCE_SHA -X main.buildDate=$((Get-Date).ToUniversalTime().ToString('o')) -X main.dirty=false" -o .artifacts/platformctl ./cmd/platformctl
          if ($LASTEXITCODE -ne 0) { throw 'Exact-revision platformctl build failed.' }
          ./.artifacts/platformctl --output json config init --name acceptance --checkout $PWD
          ./.artifacts/platformctl --output json context set acceptance --repository $env:GITHUB_REPOSITORY --branch main --checkout $PWD --kube-context kind-steadystate --cluster steadystate --profile full --http-port 8080 --https-port 8443
          ./.artifacts/platformctl --output json context use acceptance
          ./.artifacts/platformctl --output json version

      - name: Verify signed service packages
        timeout-minutes: 6
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .artifacts/phase8/acceptance/registry | Out-Null
          $identity = 'https://github.com/saadabdullaah/steadystate/.github/workflows/service-release.yml@refs/heads/main'
          $issuer = 'https://token.actions.githubusercontent.com'
          foreach ($component in @('xyz-web','xyz-api')) {
            $reference = "ghcr.io/saadabdullaah/steadystate-services:$component-v0.1.1"
            cosign verify --certificate-identity $identity --certificate-oidc-issuer $issuer $reference |
              Out-File -Encoding utf8 ".artifacts/phase8/acceptance/registry/$component-signature.json"
            if ($LASTEXITCODE -ne 0) { throw "Signature verification failed for $reference." }
            cosign verify-attestation --type spdxjson --certificate-identity $identity --certificate-oidc-issuer $issuer $reference |
              Out-File -Encoding utf8 ".artifacts/phase8/acceptance/registry/$component-attestation.json"
            if ($LASTEXITCODE -ne 0) { throw "SPDX verification failed for $reference." }
            $envelope = Get-Content -Raw ".artifacts/phase8/acceptance/registry/$component-attestation.json" | ConvertFrom-Json
            if ($envelope -is [array]) { $envelope = $envelope[0] }
            if (-not $envelope.payload) { throw "Verified SPDX attestation for $reference has no DSSE payload." }
            $statement = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String([string]$envelope.payload)) | ConvertFrom-Json
            if (-not $statement.predicate -or [string]$statement.predicate.spdxVersion -cnotmatch '^SPDX-') {
              throw "Verified SPDX attestation for $reference has no SPDX predicate."
            }
            $statement.predicate | ConvertTo-Json -Depth 100 |
              Out-File -Encoding utf8 ".artifacts/phase8/acceptance/registry/$component-sbom.spdx.json"
            docker buildx imagetools inspect $reference --format '{{json .Manifest}}' |
              Out-File -Encoding utf8 ".artifacts/phase8/acceptance/registry/$component-manifest.json"
            if ($LASTEXITCODE -ne 0) { throw "Anonymous manifest lookup failed for $reference." }
          }

      - name: Create disposable acceptance branch and verify human PR chain
        id: prepare
        timeout-minutes: 4
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: ./scripts/phase8-acceptance.ps1 -Stage Prepare

      - name: Bootstrap full profile through platformctl
        id: cluster
        timeout-minutes: 18
        shell: pwsh
        run: ./.artifacts/platformctl --output json --timeout 18m cluster up

      - name: Reserve hosted kind control-plane resources
        timeout-minutes: 2
        shell: pwsh
        run: ./scripts/phase8-acceptance.ps1 -Stage Stabilize

      - name: Start retained external backup store
        id: backup-store
        timeout-minutes: 4
        shell: pwsh
        run: ./scripts/backup-store.ps1 -Action Start

      - name: Build and load exact-branch platform images
        timeout-minutes: 10
        shell: pwsh
        run: |
          ./scripts/dev.ps1 build-images
          ./scripts/dev.ps1 load-images

      - name: Deploy disposable-branch full-profile GitOps
        id: deploy
        timeout-minutes: 30
        shell: pwsh
        run: |
          $state = Get-Content -Raw .artifacts/phase8/acceptance/state.json | ConvertFrom-Json
          ./scripts/dev.ps1 deploy-gitops -Profile full -GitRevision $state.branch -TenantFilter xyz
          ./scripts/phase8-acceptance.ps1 -Stage AwaitFoundation

      - name: Execute CLI golden path and two-PR retirement
        id: acceptance
        timeout-minutes: 45
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          PHASE8_ACCEPTANCE_AUTOMERGE: "true"
        run: ./scripts/phase8-acceptance.ps1 -Stage Test

      - name: Record verified zero-to-live transcript
        id: recording
        timeout-minutes: 5
        shell: bash
        env:
          CI: ""
          COLORTERM: truecolor
        run: timeout --signal=TERM --kill-after=15s 4m vhs docs/demonstrations/phase8-zero-to-live.tape

      - name: Finalize Phase 8 evidence
        id: finalize
        timeout-minutes: 3
        shell: pwsh
        run: ./scripts/phase8-acceptance.ps1 -Stage Finalize

      - name: Capture failure evidence before cleanup
        if: always() && steps.prepare.outcome != 'skipped' && steps.finalize.outcome != 'success'
        continue-on-error: true
        timeout-minutes: 3
        shell: pwsh
        env:
          PHASE8_FAILURE_MESSAGE: prepare=${{ steps.prepare.outcome }}, cluster=${{ steps.cluster.outcome }}, deploy=${{ steps.deploy.outcome }}, acceptance=${{ steps.acceptance.outcome }}, recording=${{ steps.recording.outcome }}, finalize=${{ steps.finalize.outcome }}
        run: ./scripts/phase8-acceptance.ps1 -Stage CaptureFailure

      - name: Capture success or failure diagnostics
        if: always()
        continue-on-error: true
        timeout-minutes: 4
        shell: pwsh
        run: |
          $clusters = @(& kind get clusters 2>$null)
          if ($LASTEXITCODE -eq 0 -and $clusters -contains 'steadystate') {
            $ready = @(& kubectl --request-timeout=5s get --raw='/readyz' 2>$null)
            if ($LASTEXITCODE -eq 0 -and ($ready -join '').Trim() -eq 'ok') {
              ./scripts/dev.ps1 diagnostics
            } else {
              New-Item -ItemType Directory -Force .artifacts/diagnostics | Out-Null
              'The disposable cluster existed, but its API was unavailable. Direct kind-container evidence is retained by Phase 8 failure capture.' |
                Set-Content -Encoding utf8 .artifacts/diagnostics/api-unavailable.txt
              $global:LASTEXITCODE = 0
            }
          } else {
            New-Item -ItemType Directory -Force .artifacts/diagnostics | Out-Null
            'Phase 8 failed before the disposable cluster was available.' | Set-Content -Encoding utf8 .artifacts/diagnostics/pre-cluster-failure.txt
            $global:LASTEXITCODE = 0
          }

      - name: Verify artifact completeness
        if: always() && steps.finalize.outcome == 'success'
        timeout-minutes: 2
        shell: pwsh
        run: |
          $required = @(
            'docs/demonstrations/phase8-zero-to-live.tape',
            '.artifacts/phase8/acceptance/phase8-zero-to-live.gif',
            '.artifacts/phase8/acceptance/evidence.json',
            '.artifacts/phase8/acceptance/transcript.txt',
            '.artifacts/phase8/acceptance/pull-requests/human-scaffold-and-activation.json',
            '.artifacts/phase8/acceptance/cli/version.json',
            '.artifacts/phase8/acceptance/cli/api-status.json',
            '.artifacts/phase8/acceptance/cli/api-provenance.json',
            '.artifacts/phase8/acceptance/doctor/healthy.json',
            '.artifacts/phase8/acceptance/doctor/failure-and-break-glass-fixtures.txt',
            '.artifacts/phase8/acceptance/audit/rejected-confirmation.json',
            '.artifacts/phase8/acceptance/telemetry/logs.json',
            '.artifacts/phase8/acceptance/telemetry/traces.json',
            '.artifacts/phase8/acceptance/telemetry/slo.json',
            '.artifacts/phase8/acceptance/security/policy.json',
            '.artifacts/phase8/acceptance/backup/retained-object-inventory.txt',
            '.artifacts/phase8/acceptance/benchmarks/resource-usage.json',
            '.artifacts/phase8/acceptance/snapshots/tenant-filter-isolation.json',
            '.artifacts/phase8/acceptance/snapshots/platform-foundation-progress.json'
          )
          foreach ($state in @('baseline','retiring','finalized')) {
            $required += @(
              ".artifacts/phase8/acceptance/rendered/$state.yaml",
              ".artifacts/phase8/acceptance/rendered/$state-catalog.yaml"
            )
          }
          foreach ($component in @('xyz-web','xyz-api')) {
            $required += @(
              ".artifacts/phase8/acceptance/registry/$component-signature.json",
              ".artifacts/phase8/acceptance/registry/$component-attestation.json",
              ".artifacts/phase8/acceptance/registry/$component-sbom.spdx.json",
              ".artifacts/phase8/acceptance/registry/$component-manifest.json"
            )
          }
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf) -or (Get-Item $path).Length -le 0) { throw "Missing or empty Phase 8 artifact: $path" }
          }
          if (@(Get-ChildItem .artifacts/phase8/acceptance/proposals -File -ErrorAction SilentlyContinue).Count -ne 6) { throw 'Phase 8 proposal evidence is incomplete.' }
          if (@(Get-ChildItem .artifacts/phase8/acceptance/pull-requests -File -ErrorAction SilentlyContinue).Count -ne 3) { throw 'Phase 8 pull-request evidence is incomplete.' }
          if (@(Get-ChildItem .artifacts/diagnostics -Recurse -File -ErrorAction SilentlyContinue).Count -eq 0) { throw 'Phase 8 diagnostics are missing.' }

      - name: Upload Phase 8 acceptance artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: phase8-acceptance-${{ env.PHASE8_SOURCE_SHA }}
          path: |
            .artifacts/phase8/acceptance/
            .artifacts/diagnostics/
            docs/demonstrations/phase8-zero-to-live.tape
          retention-days: 30
          if-no-files-found: error
          include-hidden-files: true

      - name: Delete disposable acceptance branch
        if: always() && steps.prepare.outcome != 'skipped'
        continue-on-error: true
        timeout-minutes: 2
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          $branch = "acceptance/phase8-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path .artifacts/phase8/acceptance/state.json) {
            $state = Get-Content -Raw .artifacts/phase8/acceptance/state.json | ConvertFrom-Json
            if ($state.branch) { $branch = [string]$state.branch }
          }
          if ($branch -cnotmatch '^acceptance/phase8-[0-9]+-[0-9]+$') { throw 'Refusing unsafe branch cleanup.' }
          $previous = $ErrorActionPreference; $ErrorActionPreference = 'Continue'
          gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/git/refs/heads/$branch"
          $code = $LASTEXITCODE; $ErrorActionPreference = $previous
          if ($code -notin @(0,1)) { throw 'Unexpected acceptance branch cleanup result.' }

      - name: Undeploy GitOps
        if: always()
        continue-on-error: true
        timeout-minutes: 8
        shell: pwsh
        run: |
          $clusters = @(& kind get clusters 2>$null)
          if ($LASTEXITCODE -eq 0 -and $clusters -contains 'steadystate') {
            $ready = @(& kubectl --request-timeout=5s get --raw='/readyz' 2>$null)
            if ($LASTEXITCODE -eq 0 -and ($ready -join '').Trim() -eq 'ok') { ./scripts/dev.ps1 undeploy-gitops }
            else { Write-Host 'Skipping API-driven GitOps teardown because the disposable API is unavailable.'; $global:LASTEXITCODE = 0 }
          } else { $global:LASTEXITCODE = 0 }

      - name: Destroy disposable cluster through platformctl
        if: always()
        timeout-minutes: 5
        shell: pwsh
        run: |
          if (Test-Path .artifacts/platformctl) { ./.artifacts/platformctl --output json --timeout 5m cluster down }
          else { ./scripts/dev.ps1 destroy }

      - name: Stop exact disposable backup resources
        if: always()
        timeout-minutes: 2
        shell: pwsh
        run: ./scripts/backup-store.ps1 -Action Stop -PurgeData
