name: Phase 7 acceptance

on:
  schedule:
    - cron: "29 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase7-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  acceptance:
    name: database-disaster-recovery
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create repository-scoped delivery token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.STEADYSTATE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.STEADYSTATE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: steadystate

      - name: Configure ephemeral-branch authentication
        shell: pwsh
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          $encoded = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:APP_TOKEN"))
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $encoded"

      - name: Install and verify pinned tools
        timeout-minutes: 10
        shell: pwsh
        run: |
          ./scripts/install-tools.ps1 -BaseOnly -IncludeSecurity
          ./scripts/dev.ps1 check-versions
          ./scripts/dev.ps1 verify-data

      - name: Verify signed public Phase 7 image
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.2

      - name: Verify anonymous signature and SPDX attestation
        timeout-minutes: 4
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .artifacts/phase7/acceptance/registry | Out-Null
          $image = 'ghcr.io/saadabdullaah/steadystate-demo-app:v0.7.0'
          $identity = 'https://github.com/saadabdullaah/steadystate/.github/workflows/demo-release.yml@refs/heads/main'
          $issuer = 'https://token.actions.githubusercontent.com'
          cosign verify --certificate-identity $identity --certificate-oidc-issuer $issuer $image |
            Out-File -Encoding utf8 .artifacts/phase7/acceptance/registry/signature.json
          if ($LASTEXITCODE -ne 0) { throw 'Phase 7 image signature verification failed.' }
          cosign verify-attestation --type spdxjson --certificate-identity $identity --certificate-oidc-issuer $issuer $image |
            Out-File -Encoding utf8 .artifacts/phase7/acceptance/registry/attestation.json
          if ($LASTEXITCODE -ne 0) { throw 'Phase 7 SPDX attestation verification failed.' }
          docker buildx imagetools inspect $image --format '{{json .Manifest}}' |
            Out-File -Encoding utf8 .artifacts/phase7/acceptance/registry/manifest.json
          if ($LASTEXITCODE -ne 0) { throw 'Anonymous Phase 7 registry manifest lookup failed.' }

      - name: Install pinned recording tools
        timeout-minutes: 6
        shell: bash
        run: |
          set -euo pipefail
          eval "$(grep -E '^(VHS_VERSION|TTYD_VERSION|VHS_LINUX_X86_64_SHA256|TTYD_LINUX_X86_64_SHA256)=' scripts/versions.env)"
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes ffmpeg
          fi
          install_dir="$RUNNER_TEMP/steadystate-recording/bin"
          mkdir -p "$install_dir"
          archive="$RUNNER_TEMP/vhs_${VHS_VERSION}_Linux_x86_64.tar.gz"
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 30 --output "$archive" "https://github.com/charmbracelet/vhs/releases/download/v${VHS_VERSION}/vhs_${VHS_VERSION}_Linux_x86_64.tar.gz"
          echo "${VHS_LINUX_X86_64_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --strip-components=1 --file "$archive" --directory "$install_dir"
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 30 --output "$install_dir/ttyd" "https://github.com/tsl0922/ttyd/releases/download/${TTYD_VERSION}/ttyd.x86_64"
          echo "${TTYD_LINUX_X86_64_SHA256}  ${install_dir}/ttyd" | sha256sum --check --strict
          chmod 0755 "$install_dir/vhs" "$install_dir/ttyd"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Create ephemeral Git recovery branch
        id: prepare
        timeout-minutes: 3
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: ./scripts/phase7-acceptance.ps1 -Stage Prepare

      - name: Bootstrap initial full profile
        timeout-minutes: 15
        shell: pwsh
        run: ./scripts/dev.ps1 bootstrap -Profile full

      - name: Stabilize hosted control plane
        timeout-minutes: 2
        shell: pwsh
        run: ./scripts/dev.ps1 stabilize-hosted-kind -Profile full

      - name: Start retained external backup store
        timeout-minutes: 4
        shell: pwsh
        run: ./scripts/backup-store.ps1 -Action Start

      - name: Build and load branch platform images
        timeout-minutes: 10
        shell: pwsh
        run: |
          ./scripts/dev.ps1 build-images
          ./scripts/dev.ps1 load-images

      - name: Deploy baseline exact-revision GitOps
        timeout-minutes: 20
        shell: pwsh
        run: |
          $state = Get-Content -Raw .artifacts/phase7/acceptance/state.json | ConvertFrom-Json
          ./scripts/dev.ps1 deploy-gitops -Profile full -GitRevision $state.branch

      - name: Refresh repository-scoped recovery token
        id: recovery-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.STEADYSTATE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.STEADYSTATE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: steadystate

      - name: Refresh recovery Git authentication
        shell: pwsh
        env:
          APP_TOKEN: ${{ steps.recovery-token.outputs.token }}
        run: |
          $encoded = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:APP_TOKEN"))
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $encoded"

      - name: Run whole-cluster disaster recovery
        id: recovery
        timeout-minutes: 50
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.recovery-token.outputs.token }}
        run: ./scripts/phase7-acceptance.ps1 -Stage Test

      - name: Record verified disaster-recovery transcript
        timeout-minutes: 5
        shell: bash
        env:
          CI: ""
          COLORTERM: truecolor
        run: timeout --signal=TERM --kill-after=15s 4m vhs docs/demonstrations/phase7-disaster-recovery.tape

      - name: Finalize evidence
        id: finalize
        timeout-minutes: 3
        shell: pwsh
        run: ./scripts/phase7-acceptance.ps1 -Stage Finalize

      - name: Capture failure evidence
        if: always() && steps.prepare.outcome != 'skipped' && steps.finalize.outcome != 'success'
        continue-on-error: true
        timeout-minutes: 2
        shell: pwsh
        env:
          PHASE7_FAILURE_MESSAGE: prepare=${{ steps.prepare.outcome }}, recovery=${{ steps.recovery.outcome }}, finalize=${{ steps.finalize.outcome }}
        run: ./scripts/phase7-acceptance.ps1 -Stage CaptureFailure

      - name: Capture success or failure diagnostics
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        shell: pwsh
        run: |
          $clusters = @(& kind get clusters 2>$null)
          if ($LASTEXITCODE -eq 0 -and $clusters -contains 'steadystate') {
            ./scripts/dev.ps1 diagnostics
          } else {
            New-Item -ItemType Directory -Force .artifacts/diagnostics | Out-Null
            'Phase 7 failed before the disposable cluster was created.' |
              Set-Content -Encoding utf8 .artifacts/diagnostics/pre-cluster-failure.txt
            $global:LASTEXITCODE = 0
          }

      - name: Verify artifact completeness
        if: always() && steps.finalize.outcome == 'success'
        timeout-minutes: 2
        shell: pwsh
        run: |
          $required = @(
            'docs/demonstrations/phase7-disaster-recovery.tape',
            '.artifacts/phase7/acceptance/phase7-disaster-recovery.gif',
            '.artifacts/phase7/acceptance/transcript.txt',
            '.artifacts/phase7/acceptance/evidence.json',
            '.artifacts/phase7/acceptance/rto-rpo-report.json',
            '.artifacts/phase7/acceptance/registry/signature.json',
            '.artifacts/phase7/acceptance/registry/attestation.json',
            '.artifacts/phase7/acceptance/registry/manifest.json',
            '.artifacts/phase7/acceptance/snapshots/source-backup.json',
            '.artifacts/phase7/acceptance/snapshots/source-object-inventory.txt',
            '.artifacts/phase7/acceptance/snapshots/pinned-data-images.json',
            '.artifacts/phase7/acceptance/snapshots/recovered-data.yaml',
            '.artifacts/phase7/acceptance/snapshots/success-data.yaml',
            '.artifacts/phase7/acceptance/snapshots/success-object-inventory.txt',
            '.artifacts/phase7/acceptance/snapshots/database-trace.json',
            '.artifacts/phase7/acceptance/snapshots/alertmanager-backup-outage.json',
            '.artifacts/phase7/acceptance/snapshots/prometheus-backup-alert.json',
            '.artifacts/phase7/acceptance/rendered/database.yaml',
            '.artifacts/phase7/acceptance/rendered/application.yaml',
            '.artifacts/phase7/acceptance/rendered/generated-data-resources.yaml',
            '.artifacts/phase7/acceptance/logs/success-operator.log',
            '.artifacts/phase7/acceptance/logs/success-cnpg.log',
            '.artifacts/phase7/acceptance/logs/success-barman.log',
            '.artifacts/phase7/acceptance/logs/success-application.log',
            '.artifacts/phase7/acceptance/logs/success-argo.log',
            '.artifacts/phase7/acceptance/logs/success-seaweedfs.log'
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf) -or (Get-Item $path).Length -le 0) {
              throw "Missing or empty Phase 7 acceptance artifact: $path"
            }
          }
          if (@(Get-ChildItem .artifacts/diagnostics -Recurse -File -ErrorAction SilentlyContinue).Count -eq 0) {
            throw 'Phase 7 cluster diagnostics are missing.'
          }

      - name: Upload Phase 7 acceptance artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: phase7-acceptance-${{ github.sha }}
          path: |
            .artifacts/phase7/acceptance/
            .artifacts/diagnostics/
            docs/demonstrations/phase7-disaster-recovery.tape
          retention-days: 30
          if-no-files-found: error
          include-hidden-files: true

      - name: Create repository-scoped cleanup token
        if: always() && steps.prepare.outcome != 'skipped'
        id: cleanup-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.STEADYSTATE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.STEADYSTATE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: steadystate

      - name: Delete ephemeral Git branch
        if: always() && steps.prepare.outcome != 'skipped'
        continue-on-error: true
        timeout-minutes: 2
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.cleanup-token.outputs.token }}
        run: |
          $branch = "acceptance/phase7-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath .artifacts/phase7/acceptance/state.json) {
            $state = Get-Content -Raw -LiteralPath .artifacts/phase7/acceptance/state.json | ConvertFrom-Json
            if ($state.branch) { $branch = [string]$state.branch }
          }
          gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/git/refs/heads/$branch"

      - name: Undeploy GitOps
        if: always()
        continue-on-error: true
        timeout-minutes: 8
        shell: pwsh
        run: |
          $clusters = @(& kind get clusters 2>$null)
          if ($LASTEXITCODE -eq 0 -and $clusters -contains 'steadystate') {
            ./scripts/dev.ps1 undeploy-gitops
          } else {
            Write-Host "Cluster 'steadystate' is already absent; GitOps cleanup is complete."
            $global:LASTEXITCODE = 0
          }

      - name: Destroy disposable cluster
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/dev.ps1 destroy

      - name: Remove exact disposable backup resources
        if: always()
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/backup-store.ps1 -Action Stop -PurgeData
