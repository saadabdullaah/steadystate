name: Platformctl release

on:
  workflow_dispatch:
  push:
    tags:
      - v0.8.*

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: platformctl-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: package and attest platformctl
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Install exact Go, Syft, and Cosign
        shell: pwsh
        run: |
          ./scripts/install-tools.ps1 -BaseOnly -IncludeSecurity
          Add-Content -LiteralPath $env:GITHUB_PATH -Value "$env:GITHUB_WORKSPACE/.tools/go/linux-amd64/bin"
          Add-Content -LiteralPath $env:GITHUB_PATH -Value "$env:GITHUB_WORKSPACE/.tools/bin/linux-amd64"
      - name: Verify tests and generated CLI documentation
        shell: pwsh
        run: |
          go test ./internal/platformctl/...
          go run ./cmd/platformctl docs --directory .artifacts/generated-cli
          $expected = Get-ChildItem docs/cli -Recurse -File |
            Where-Object { $_.Name -notin @('README.md','operations.md') } |
            ForEach-Object {
            [PSCustomObject]@{ Path = $_.FullName.Substring((Resolve-Path docs/cli).Path.Length); Hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash }
          }
          $actual = Get-ChildItem .artifacts/generated-cli -Recurse -File | ForEach-Object {
            [PSCustomObject]@{ Path = $_.FullName.Substring((Resolve-Path .artifacts/generated-cli).Path.Length); Hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash }
          }
          if ((Compare-Object $expected $actual -Property Path,Hash).Count -ne 0) { throw 'Generated CLI documentation is stale' }
      - name: Build snapshot archives
        if: github.ref_type != 'tag'
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --snapshot --clean
      - name: Build draft release archives
        if: github.ref_type == 'tag'
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean
      - name: Sign checksum manifest with GitHub OIDC
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: cosign sign-blob --yes --bundle dist/checksums.txt.sigstore.json dist/checksums.txt
      - name: Attest release archives
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.spdx.json
            dist/checksums.txt
      - name: Upload checksum signature to draft release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload $env:GITHUB_REF_NAME dist/checksums.txt.sigstore.json --clobber
      - name: Upload release snapshot evidence
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: platformctl-release-${{ github.sha }}
          path: dist/
          retention-days: 30
          if-no-files-found: error
          include-hidden-files: true
