name: CodeQL

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 1 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: codeql (${{ matrix.language }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Install pinned Node.js
        if: matrix.language == 'javascript-typescript'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.17.0
          cache: npm
          cache-dependency-path: web/portal/package-lock.json
      - name: Install and build portal
        if: matrix.language == 'javascript-typescript'
        shell: pwsh
        run: |
          ./scripts/install-tools.ps1 -BaseOnly
          Push-Location web/portal
          npm ci --ignore-scripts
          npm run build
          npm test
          Pop-Location
      - name: Analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
