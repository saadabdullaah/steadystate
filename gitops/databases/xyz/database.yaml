apiVersion: platform.steadystate.dev/v1alpha1
kind: Database
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    steadystate.dev/deletion-request: 2cfed3b6-f580-44e0-ba48-64304bd32f6c
  name: xyz
  namespace: team-xyz
spec:
