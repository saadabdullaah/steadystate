apiVersion: platform.steadystate.dev/v1alpha1
kind: Database
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    steadystate.dev/deletion-request: af85ec3f-0bed-4d53-9d7e-5c4bf062c8cd
  name: xyz
  namespace: team-xyz
spec:
