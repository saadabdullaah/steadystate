apiVersion: platform.steadystate.dev/v1alpha1
kind: Database
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    steadystate.dev/deletion-request: a0a94a8c-421f-4d1c-8d46-28a92b190a96
  name: xyz
  namespace: team-xyz
spec:
  backups:
    enabled: true
    retention: 7d
    schedule: 0 0 2 * * *
  engine: postgres
  instances: 1
  storage:
    size: 1Gi
    storageClassName: local-path
