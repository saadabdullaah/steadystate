apiVersion: platform.steadystate.dev/v1alpha1
kind: Database
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    steadystate.dev/deletion-request: bc8cae81-8e24-4ed1-a07e-8c58f1770836
  name: xyz
  namespace: team-xyz
spec:
  backups:
    enabled: true
    retention: 7d
    schedule: 0 0 2 * * *
  engine: postgres
  instances: 1
  storage:
    size: 1Gi
    storageClassName: local-path
