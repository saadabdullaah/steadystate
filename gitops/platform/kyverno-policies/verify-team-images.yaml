apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: steadystate-verify-team-images
  labels:
    app.kubernetes.io/part-of: steadystate
spec:
  validationActions:
    - Deny
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 15
  evaluation:
    admission:
      enabled: true
    background:
      enabled: true
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: steadystate.dev/team
          operator: Exists
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
  matchConditions:
    - name: exclude-exact-cnpg-operands
      expression: >-
        !(
          has(object.metadata.labels) &&
          'cnpg.io/cluster' in object.metadata.labels &&
          'app.kubernetes.io/managed-by' in object.metadata.labels &&
          object.metadata.labels['app.kubernetes.io/managed-by'] == 'cloudnative-pg' &&
          'app.kubernetes.io/name' in object.metadata.labels &&
          object.metadata.labels['app.kubernetes.io/name'] == 'postgresql' &&
          'app.kubernetes.io/component' in object.metadata.labels &&
          object.metadata.labels['app.kubernetes.io/component'] == 'database' &&
          'app.kubernetes.io/instance' in object.metadata.labels &&
          object.metadata.labels['app.kubernetes.io/instance'] ==
            object.metadata.labels['cnpg.io/cluster'] &&
          has(object.spec.serviceAccountName) &&
          object.spec.serviceAccountName == object.metadata.labels['cnpg.io/cluster'] &&
          has(object.metadata.ownerReferences) &&
          (
            object.metadata.ownerReferences.exists(owner,
              owner.apiVersion == 'postgresql.cnpg.io/v1' &&
              owner.kind == 'Cluster' &&
              owner.name == object.metadata.labels['cnpg.io/cluster'] &&
              has(owner.controller) &&
              owner.controller) ||
            (
              'cnpg.io/jobRole' in object.metadata.labels &&
              object.metadata.labels['cnpg.io/jobRole'] in
                ['import', 'initdb', 'pgbasebackup', 'full-recovery', 'join', 'snapshot-recovery'] &&
              object.metadata.ownerReferences.exists(owner,
                owner.apiVersion == 'batch/v1' &&
                owner.kind == 'Job' &&
                owner.name.startsWith(object.metadata.labels['cnpg.io/cluster'] + '-') &&
                owner.name.endsWith('-' + object.metadata.labels['cnpg.io/jobRole']) &&
                has(owner.controller) &&
                owner.controller)
            )
          ) &&
          (
            object.spec.containers +
            object.spec.?initContainers.orValue([])
          ).all(container,
            container.image ==
              'ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie@sha256:1e6adb18ff3d5a538ff8fcc422c47652cc3b2cc133d5c87b6fd306660f36ffe9' ||
            container.image ==
              'ghcr.io/cloudnative-pg/cloudnative-pg:1.30.0' ||
            container.image ==
              'ghcr.io/cloudnative-pg/cloudnative-pg@sha256:a2701eb97cdd2a34b1fdb2cb51987f544b706e40bec72ae7146cd8580efefebb' ||
            container.image ==
              'ghcr.io/cloudnative-pg/plugin-barman-cloud-sidecar:v0.13.0' ||
            container.image ==
              'ghcr.io/cloudnative-pg/plugin-barman-cloud-sidecar@sha256:990361af3319f9e23aafa0f6d7981f99bf1f69b4e6a85cf1bc7d71d6f09bb288')
        )
    - name: unmanaged-or-signature-requested
      expression: >-
        !has(object.metadata.labels) ||
        !('app.kubernetes.io/managed-by' in object.metadata.labels) ||
        object.metadata.labels['app.kubernetes.io/managed-by'] != 'steadystate' ||
        (
          'steadystate.dev/require-signed-image' in object.metadata.labels &&
          object.metadata.labels['steadystate.dev/require-signed-image'] == 'true'
        )
  matchImageReferences:
    - glob: "*"
  validationConfigurations:
    mutateDigest: true
    required: true
    verifyDigest: true
  attestors:
    - name: steadystateDelivery
      cosign:
        keyless:
          identities:
            - subject: https://github.com/saadabdullaah/steadystate/.github/workflows/demo-release.yml@refs/heads/main
              issuer: https://token.actions.githubusercontent.com
        ctlog:
          url: https://rekor.sigstore.dev
  attestations:
    - name: spdxSBOM
      intoto:
        type: https://spdx.dev/Document
  validations:
    - expression: >-
        images.containers.map(image,
          verifyImageSignatures(image, [attestors.steadystateDelivery])
        ).all(results, results > 0)
      message: Images must be signed by the SteadyState main-branch demo release workflow.
    - expression: >-
        images.containers.map(image,
          verifyAttestationSignatures(image, attestations.spdxSBOM, [attestors.steadystateDelivery])
        ).all(results, results > 0)
      message: Images must carry a verified SPDX SBOM attestation from the SteadyState main-branch demo release workflow.
