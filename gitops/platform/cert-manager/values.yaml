global:
  leaderElection:
    namespace: cert-manager
crds:
  enabled: true
prometheus:
  enabled: false
resources:
  requests:
    cpu: 20m
    memory: 48Mi
  limits:
    cpu: 200m
    memory: 128Mi
webhook:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 96Mi
cainjector:
  resources:
    requests:
      cpu: 10m
      memory: 48Mi
    limits:
      cpu: 100m
      # Full-profile startup reconciles the complete SteadyState CRD set. The
      # hosted GA proof measured the previous 128 MiB limit being exceeded.
      memory: 256Mi
