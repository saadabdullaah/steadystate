installCRDs: true
keepCRDs: true
clusterInstall: true
createClusterAggregateRoles: false

controller:
  replicas: 1
  # The controller downloads the checksum-pinned Gateway API plugin before it
  # starts its health server. Cold Windows/Docker Desktop networks can take
  # several minutes, so liveness must not turn a slow download into a restart
  # loop. Readiness still keeps the Application Progressing until startup ends.
  livenessProbe:
    httpGet:
      path: /healthz
      port: healthz
    initialDelaySeconds: 600
    periodSeconds: 20
    timeoutSeconds: 10
    failureThreshold: 6
  readinessProbe:
    httpGet:
      path: /metrics
      port: metrics
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 12
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 192Mi
  trafficRouterPlugins:
    - name: argoproj-labs/gatewayAPI
      location: https://github.com/argoproj-labs/rollouts-plugin-trafficrouter-gatewayapi/releases/download/v0.16.0/gatewayapi-plugin-linux-amd64
      sha256: 3f129e6a1ea948932f440b16dfb9eae636a065857eb27311928e5790593103c1

providerRBAC:
  enabled: true
  providers:
    istio: false
    smi: false
    ambassador: false
    awsLoadBalancerController: false
    awsAppMesh: false
    traefik: false
    apisix: false
    contour: false
    glooPlatform: false
    gatewayAPI: false
  additionalRules:
    - apiGroups:
        - ""
      resources:
        - services
      verbs:
        - get
    - apiGroups:
        - gateway.networking.k8s.io
      resources:
        - httproutes
      verbs:
        - get
        - list
        - update
        - patch

dashboard:
  enabled: false
